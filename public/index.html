<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby-Gear Trade Study</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1>👶 Baby-Gear Trade Study</h1>
      <span id="save-status" class="save-status" aria-live="polite"></span>
    </div>
    <div class="topbar-right">
      <label class="budget-field">
        Overall budget $
        <input type="number" id="overall-budget" min="0" step="10" />
      </label>
      <button id="btn-export" class="btn">Export JSON</button>
      <button id="btn-import" class="btn">Import JSON</button>
      <input type="file" id="import-file" accept="application/json" hidden />
      <button id="btn-reset" class="btn btn-danger">Reset to seed</button>
    </div>
  </header>

  <main id="app">
    <section id="dashboard" class="dashboard"><!-- summary rendered here --></section>
    <section id="modules"><!-- modules rendered here --></section>
    <section id="inventory-section"><!-- inventory rendered here --></section>
  </main>

  <footer class="footer">
    <small>Data persists to <code>data/state.json</code> on the server (with a localStorage fallback). Use Export/Import to move it.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
